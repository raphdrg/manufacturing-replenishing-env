# hard - three products, eight components, and an ERP whose records drift from the truth.
name: hard
tier_id: 2
n_products: 3
n_components: 8
min_shared: 3
horizon: 20
bom_values: [1, 2, 4]
production_prob: 0.5
batch_mu: [5, 25]
batch_sigma: 0.3
shutdown_days: [2, 3]
lead_time: [2, 6]
lot_sizes: [5, 10, 25]
moq_mult: [1, 3]
unit_cost_logu: [0.5, 50.0]
unit_volume: [0.05, 1.0]
price_volatility: [0.05, 0.10]  # a volatile market: watch the price history
eta: [0.5, 1.0]                # the records drift from the truth
late_delivery_prob: 0.25
late_delivery_days: [1, 3]
demand_surge_prob: 0.10       # rush orders are routine
demand_surge_frac: [0.15, 0.40]
capacity_slack: [0.25, 0.40]
budget_slack: 0.25
noise:
  shrink: true
  short_delivery: true
