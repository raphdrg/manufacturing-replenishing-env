# easy - single production line, noise-free ERP.
name: easy
tier_id: 0
n_products: 1
n_components: 3
min_shared: 0
horizon: 10
bom_values: [1, 2]
production_prob: 0.8
batch_mu: [5, 15]
batch_sigma: 0.3
shutdown_days: [0, 0]
lead_time: [1, 3]
lot_sizes: [1]
moq_mult: [1, 1]
unit_cost_logu: [0.5, 50.0]
unit_volume: [0.05, 1.0]
price_volatility: [0.0, 0.0]  # a fixed catalogue price
eta: [0.0, 0.0]                # ERP records are exact
late_delivery_prob: 0.05      # suppliers are mostly reliable
late_delivery_days: [1, 1]
demand_surge_prob: 0.0        # the forecast is the truth
demand_surge_frac: [0.0, 0.0]
capacity_slack: [0.60, 0.60]
budget_slack: 0.70   # room for a planner who carries safety stock
noise:
  shrink: true
  short_delivery: true
